<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投資儀表板預覽</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --border: #1f2937;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: "Inter", "Noto Sans TC", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .wrapper {
      max-width: 960px;
      width: 100%;
      padding: 48px 24px 32px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      margin: 0 0 24px;
      color: var(--muted);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    a.preview {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      background: linear-gradient(145deg, rgba(37, 99, 235, 0.1), rgba(37, 99, 235, 0.04));
      text-decoration: none;
      transition: transform 120ms ease, box-shadow 120ms ease;
      font-weight: 600;
    }

    a.preview:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.16);
    }

    .preview span.label {
      display: block;
      font-size: 15px;
    }

    .preview span.desc {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      margin-top: 4px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(37, 99, 235, 0.12);
      border-radius: 999px;
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
      border: 1px solid rgba(37, 99, 235, 0.18);
    }

    .meta {
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .meta strong {
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <div class="card">
      <div class="pill">預覽導航</div>
      <h1>投資儀表板與交易紀錄預覽</h1>
      <p class="subtitle">啟動伺服器後，點選下方連結即可瀏覽 Dashboard 與交易/配息頁面示意。</p>
      <div class="actions">
        <a class="preview" href="/dashboard">
          <span>
            <span class="label">Dashboard</span>
            <span class="desc">KPI 卡片、持股清單、配置圖表與再平衡提醒</span>
          </span>
          <span aria-hidden="true">→</span>
        </a>
        <a class="preview" href="/transactions">
          <span>
            <span class="label">交易與配息紀錄</span>
            <span class="desc">買賣流水、匯入占位、手動輸入與股利入帳</span>
          </span>
          <span aria-hidden="true">→</span>
        </a>
      </div>
      <div class="meta">
        <span>開啟方式：<strong>npm start</strong> 後於瀏覽器前往 <strong>http://localhost:3000</strong></span>
      </div>
    </div>
  </main>
</body>
</html>
